<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unscroll – dodaj znajomego</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#151515;color:#f2f1ee;font-family:system-ui,sans-serif;text-align:center;padding:24px}
h1{font-size:34px;margin:0 0 8px}h1 b{color:#ff5a1f}p{color:#8d8a85;margin:0 0 22px}
a.b{display:inline-block;background:#ff5a1f;color:#fff;text-decoration:none;font-weight:700;padding:16px 28px;border-radius:99px}
.s{display:block;margin-top:18px;color:#8d8a85;font-size:14px}</style></head><body><main>
<h1><b>Un</b>scroll</h1><p>Znajomy zaprasza Cię do rankingu.</p>
<a class="b" id="o" href="#">Otwórz w Unscroll</a>
<span class="s">Nie masz aplikacji? Poproś znajomego o plik Unscroll.apk.</span></main>
<script>var c=location.hash.slice(1);var u='unscroll://add/'+c;var a=document.getElementById('o');
if(!c){a.style.display='none'}else{a.href=u;setTimeout(function(){location.href=u},300)}</script></body></html>
